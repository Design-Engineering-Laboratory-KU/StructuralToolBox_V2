name: "🐛 Bug report / バグ報告"
description: "Report a problem with Structural Toolbox / Structural Toolbox の不具合を報告します"
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve Structural Toolbox.

        Structural Toolbox の改善にご協力いただきありがとうございます。

        **Important / 注意**
        This is a public repository. Do not upload confidential project data,
        personal information, or structural models that cannot be made public.

        このリポジトリは公開されています。
        実案件の機密データ、個人情報、公開できない解析モデルは添付しないでください。

  - type: dropdown
    id: area
    attributes:
      label: "Area / 該当する機能"
      description: "Where did the problem occur? / どの部分で問題が発生しましたか？"
      options:
        - Installation / インストール
        - GUI
        - Solver / 解析
        - Input data / 入力データ
        - Results / 結果表示
        - Grasshopper
        - Documentation / マニュアル
        - Other / その他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Version / バージョン"
      description: "If known, enter the version or date of Structural Toolbox you are using."
      placeholder: "e.g. 0.1.0 or 2026-09-29"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: "Operating system / OS"
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other / その他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "Problem / 問題の内容"
      description: "Please briefly describe what went wrong. / 何が問題だったか簡潔に説明してください。"
      placeholder: "Example: The analysis stops when I click Solve."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to reproduce / 再現手順"
      description: "Please describe the steps needed to reproduce the problem."
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior / 期待した結果"
      description: "What did you expect to happen? / 本来どのようになると考えていましたか？"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior / 実際の結果"
      description: "What actually happened? / 実際にはどうなりましたか？"
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: "Error message / エラーメッセージ"
      description: "Paste the error message here, if available."
      render: shell
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: "Screenshots or sample files / スクリーンショット・サンプルファイル"
      description: |
        You can drag and drop screenshots or a small .dat file here if it can be shared publicly.

        公開して問題ない場合のみ、スクリーンショットや再現用の小さな .dat ファイルを添付してください。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "Public information / 公開情報の確認"
      options:
        - label: "I confirm that the information uploaded here may be made public. / 添付した情報が公開されても問題ないことを確認しました。"
          required: true
