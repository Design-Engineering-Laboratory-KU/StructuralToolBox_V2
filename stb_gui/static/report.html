<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1dee4">
  <meta name="color-scheme" content="dark light">
  <title>計算書出力</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/loads_verify.css">
  <link rel="stylesheet" href="/static/report.css">
</head>
<body class="loads-verify-body">
  <header class="loads-verify-toolbar">
    <div class="loads-verify-toolbar-left">
      <h1 class="loads-verify-title">計算書出力</h1>
      <span class="loads-verify-path">確認申請補助計算書（stb report）または壁量計算書（stb wallcalc）を書き出します。</span>
    </div>
    <div class="loads-verify-toolbar-right">
      <button type="button" id="btnRpRun" class="btn-primary">計算書を作成</button>
    </div>
  </header>

  <main class="loads-verify-main">
    <form id="rpForm" class="rp-form" autocomplete="off">
      <label class="rp-label" for="rpKind">種類</label>
      <select id="rpKind" class="rp-select">
        <option value="confirmation">確認申請補助計算書（解析あり）</option>
        <option value="wall_quantity">壁量計算書</option>
      </select>

      <label class="rp-label" for="rpInput">入力（.project.json または .dat のフルパス）</label>
      <div class="rp-row">
        <input type="text" id="rpInput" class="rp-input" spellcheck="false"
               placeholder="C:\path\to\model.project.json">
        <button type="button" id="btnRpCurrent" class="lv-apply-btn" title="表示中のモデルの project.json を入れる">表示中のモデル</button>
      </div>
      <p class="rp-hint">エクスプローラーでファイルを Shift+右クリック →「パスのコピー」で貼り付けられます。Structural Toolbox のフォルダの外（Dropbox など）でも構いません。</p>

      <label class="rp-label" for="rpFormat">形式</label>
      <select id="rpFormat" class="rp-select">
        <option value="pdf">PDF</option>
        <option value="html">HTML</option>
        <option value="markdown">Markdown</option>
      </select>
      <p class="rp-hint">PDF は Microsoft Edge（または Chrome）の印刷機能で作ります。A4、ブラウザで「印刷 / PDF保存」したときと同じ体裁です。</p>

      <label class="rp-label" for="rpOutput">出力ファイル（空欄なら入力と同じフォルダに自動の名前で保存）</label>
      <input type="text" id="rpOutput" class="rp-input" spellcheck="false" placeholder="（自動）">
    </form>

    <section class="lv-section rp-result">
      <p id="rpStatus" class="loads-verify-status"></p>
      <p id="rpOpenRow" class="rp-open" hidden>
        <button type="button" id="btnRpOpen" class="lv-apply-btn">計算書を開く</button>
        <span id="rpOutPath" class="rp-outpath"></span>
      </p>
      <div id="rpWarnings" hidden>
        <h2 class="lv-section-title">警告（<span id="rpWarnCount">0</span> 件）</h2>
        <ul id="rpWarnList" class="rp-warn-list"></ul>
      </div>
    </section>
  </main>

  <script src="/static/report.js"></script>
</body>
</html>
